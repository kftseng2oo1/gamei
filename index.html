<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2420">
<title>易經六十四卦 - 上下卦猜卦名</title>
 <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">


<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2b2420;
    font-family: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
    color: #ece3d3;
    overflow-x: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom) 14px;
  }
  header {
    text-align: center;
    padding: 18px 0 10px 0;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 4px;
    color: #d9b45c;
  }
  header p {
    margin: 6px 0 0 0;
    font-size: 12px;
    color: #a89a82;
    letter-spacing: 1px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin: 14px 0;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    background: #3a3128;
    border: 1px solid #55483a;
    color: #cbbfa8;
    border-radius: 8px;
    font-size: 14px;
    letter-spacing: 2px;
  }
  .tab-btn.active {
    background: #6e2b26;
    border-color: #a34a3c;
    color: #f4e6c8;
  }
  .hidden { display: none !important; }

  .mode-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px 0;
    background: #2f271f;
    border: 1px solid #4a3f33;
    color: #a89a82;
    border-radius: 8px;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .mode-btn.active {
    background: #3a2c1c;
    border-color: #d9b45c;
    color: #d9b45c;
  }
  .mode-hint {
    text-align: center;
    font-size: 11px;
    color: #7d7062;
    margin-bottom: 12px;
  }

  .stats {
    text-align: center;
    font-size: 13px;
    color: #b9ac93;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .stats span { color: #d9b45c; font-weight: bold; }

  .hexagram-card {
    background: #352b22;
    border: 1px solid #55483a;
    border-radius: 14px;
    padding: 20px 0 14px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hexagram-display {
    width: 160px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .yao-line {
    height: 14px;
    display: flex;
    justify-content: space-between;
  }
  .yao-line .bar {
    height: 14px;
    background: #d9b45c;
    border-radius: 3px;
  }
  .yao-line.yang .bar { width: 100%; }
  .yao-line.yin .bar { width: 44%; }
  .trigram-divider {
    width: 100%;
    height: 1px;
    background: #55483a;
    margin: 2px 0;
  }
  .trigram-info {
    margin-top: 16px;
    font-size: 15px;
    color: #ece3d3;
    text-align: center;
    line-height: 1.8;
  }
  .trigram-info b { color: #d9b45c; }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .opt-btn {
    padding: 14px 6px;
    background: #3a3128;
    border: 1px solid #55483a;
    border-radius: 10px;
    color: #ece3d3;
    font-size: 16px;
    letter-spacing: 1px;
  }
  .opt-btn.correct {
    background: #2f4a2f;
    border-color: #5c9a5c;
    color: #cdeecd;
  }
  .opt-btn.wrong {
    background: #5a2b26;
    border-color: #a34a3c;
    color: #f2d3cd;
  }
  .opt-btn.disabled-dim {
    opacity: 0.45;
  }

  .feedback {
    text-align: center;
    min-height: 22px;
    margin-top: 14px;
    font-size: 14px;
    color: #d9b45c;
  }

  #nextBtn {
    margin-top: 10px;
    padding: 13px 0;
    background: #6e2b26;
    border: 1px solid #a34a3c;
    border-radius: 10px;
    color: #f4e6c8;
    font-size: 15px;
    letter-spacing: 2px;
  }

  .reset-row {
    text-align: center;
    margin-top: 18px;
  }
  .reset-row button {
    background: none;
    border: none;
    color: #7d7062;
    font-size: 12px;
    text-decoration: underline;
  }

  /* Table view */
  #tableView { padding-bottom: 20px; }
  .table-scroll {
    overflow-x: auto;
    border: 1px solid #55483a;
    border-radius: 10px;
  }
  table.hex-grid {
    border-collapse: collapse;
    width: 100%;
    min-width: 620px;
  }
  table.hex-grid th, table.hex-grid td {
    border: 1px solid #4a3f33;
    text-align: center;
    padding: 6px 4px;
    font-size: 12px;
  }
  table.hex-grid th {
    background: #3a3128;
    color: #d9b45c;
    font-size: 13px;
  }
  table.hex-grid td {
    background: #2f271f;
    color: #d8cdb8;
  }
  table.hex-grid td .sym { display:block; font-size:15px; color:#d9b45c; }
  table.hex-grid td { cursor: pointer; }
  table.hex-grid td:active { background: #45392a; }
  .table-hint {
    font-size: 12px;
    color: #a89a82;
    text-align: center;
    margin: 10px 0 14px 0;
  }
  .table-hint b { color: #d9b45c; }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-card {
    width: 100%;
    max-width: 480px;
    background: #352b22;
    border: 1px solid #55483a;
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    padding: 22px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
    max-height: 78vh;
    overflow-y: auto;
    --modal-font-scale: 1;
  }
  .modal-font-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .modal-font-label {
    font-size: 12px;
    color: #7d7062;
    letter-spacing: 1px;
    margin-right: 4px;
  }
  .font-btn {
    padding: 6px 14px;
    background: #2f271f;
    border: 1px solid #55483a;
    border-radius: 8px;
    color: #d9b45c;
    font-size: 14px;
    font-weight: bold;
  }
  .font-btn:active { background: #45392a; }
  .font-btn:disabled { opacity: 0.35; }
  .modal-num {
    text-align: center;
    font-size: calc(12px * var(--modal-font-scale));
    color: #a89a82;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .modal-title {
    text-align: center;
    font-size: calc(24px * var(--modal-font-scale));
    color: #d9b45c;
    letter-spacing: 3px;
    margin-bottom: 14px;
  }
  .modal-hex {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 120px;
    margin: 0 auto 16px auto;
  }
  .modal-hex .yao-line { height: 11px; }
  .modal-hex .bar { height: 11px; }
  .modal-trigrams {
    text-align: center;
    font-size: calc(14px * var(--modal-font-scale));
    color: #ece3d3;
    line-height: 1.8;
    margin-bottom: 14px;
  }
  .modal-trigrams b { color: #d9b45c; }
  .modal-guaci-label {
    font-size: calc(12px * var(--modal-font-scale));
    color: #a89a82;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .modal-guaci {
    font-size: calc(15px * var(--modal-font-scale));
    color: #ece3d3;
    line-height: 1.9;
    letter-spacing: 1px;
  }
  .modal-yao-label {
    font-size: calc(12px * var(--modal-font-scale));
    color: #a89a82;
    letter-spacing: 2px;
    margin: 18px 0 6px 0;
  }
  .modal-yao-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .modal-yao-list li {
    font-size: calc(14px * var(--modal-font-scale));
    color: #ece3d3;
    line-height: 1.7;
    padding: 8px 0;
    border-top: 1px solid #4a3f33;
  }
  .modal-yao-list li:first-child { border-top: none; }
  .modal-yao-extra {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #55483a;
    font-size: calc(14px * var(--modal-font-scale));
    color: #d9b45c;
  }
  .modal-close {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px 0;
    background: #6e2b26;
    border: 1px solid #a34a3c;
    border-radius: 10px;
    color: #f4e6c8;
    font-size: 14px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>易經六十四卦</h1>
    <p>上下卦組合 · 猜卦名</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabQuiz">測驗模式</button>
    <button class="tab-btn" id="tabTable">六十四卦表</button>
  </div>

  <section id="quizView">
    <div class="mode-row">
      <button class="mode-btn active" id="modeNormalBtn">初級</button>
      <button class="mode-btn" id="modeAdvancedBtn">進階</button>
    </div>
    <p class="mode-hint" id="modeHint">初級：四個選項來自任意卦名</p>

    <div class="stats">
      本輪答對 <span id="scoreEl">0</span> ／ <span id="totalEl">0</span>　
      連續 <span id="streakEl">0</span>　
      最佳 <span id="bestEl">0</span>
    </div>

    <div class="hexagram-card">
      <div class="hexagram-display" id="hexDisplay"></div>
      <div class="trigram-info" id="trigramInfo"></div>
    </div>

    <div class="options" id="optionsContainer"></div>

    <div class="feedback" id="feedback"></div>

    <button id="nextBtn" class="hidden">下一題 →</button>

    <div class="reset-row">
      <button id="resetStatsBtn">重設統計</button>
    </div>
  </section>

  <section id="tableView" class="hidden">
    <p class="table-hint">直排＝<b>上卦</b>　橫排＝<b>下卦</b>　（點卦名看詳情）</p>
    <div class="table-scroll">
      <table class="hex-grid" id="hexGridTable"></table>
    </div>
  </section>

</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <div class="modal-font-row">
      <span class="modal-font-label">字體大小</span>
      <button class="font-btn" id="fontDecBtn" aria-label="縮小字體">A－</button>
      <button class="font-btn" id="fontIncBtn" aria-label="放大字體">A＋</button>
    </div>
    <div class="modal-num" id="modalNum"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-hex" id="modalHexDisplay"></div>
    <div class="modal-trigrams" id="modalTrigrams"></div>
    <div class="modal-guaci-label">卦辭</div>
    <div class="modal-guaci" id="modalGuaci"></div>
    <div class="modal-yao-label">爻辭</div>
    <ul class="modal-yao-list" id="modalYaoList"></ul>
    <button class="modal-close" id="modalCloseBtn">關閉</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var ORDER = ['乾', '兌', '離', '震', '巽', '坎', '艮', '坤'];

  var TRIGRAM = {
    '乾': { symbol: '☰', nature: '天', lines: [1, 1, 1] },
    '兌': { symbol: '☱', nature: '澤', lines: [1, 1, 0] },
    '離': { symbol: '☲', nature: '火', lines: [1, 0, 1] },
    '震': { symbol: '☳', nature: '雷', lines: [1, 0, 0] },
    '巽': { symbol: '☴', nature: '風', lines: [0, 1, 1] },
    '坎': { symbol: '☵', nature: '水', lines: [0, 1, 0] },
    '艮': { symbol: '☶', nature: '山', lines: [0, 0, 1] },
    '坤': { symbol: '☷', nature: '地', lines: [0, 0, 0] }
  };

  // rows = upper trigram (index by ORDER), cols = lower trigram (index by ORDER)
  var HEX_TABLE = [
    ['乾為天', '天澤履', '天火同人', '天雷无妄', '天風姤', '天水訟', '天山遯', '天地否'],
    ['澤天夬', '兌為澤', '澤火革', '澤雷隨', '澤風大過', '澤水困', '澤山咸', '澤地萃'],
    ['火天大有', '火澤睽', '離為火', '火雷噬嗑', '火風鼎', '火水未濟', '火山旅', '火地晉'],
    ['雷天大壯', '雷澤歸妹', '雷火豐', '震為雷', '雷風恆', '雷水解', '雷山小過', '雷地豫'],
    ['風天小畜', '風澤中孚', '風火家人', '風雷益', '巽為風', '風水渙', '風山漸', '風地觀'],
    ['水天需', '水澤節', '水火既濟', '水雷屯', '水風井', '坎為水', '水山蹇', '水地比'],
    ['山天大畜', '山澤損', '山火賁', '山雷頤', '山風蠱', '山水蒙', '艮為山', '山地剝'],
    ['地天泰', '地澤臨', '地火明夷', '地雷復', '地風升', '地水師', '地山謙', '坤為地']
  ];

  // King Wen sequence number for each [upperIdx][lowerIdx] combination
  var KW_NUM = [
    [1, 10, 13, 25, 44, 6, 33, 12],
    [43, 58, 49, 17, 28, 47, 31, 45],
    [14, 38, 30, 21, 50, 64, 56, 35],
    [34, 54, 55, 51, 32, 40, 62, 16],
    [9, 61, 37, 42, 57, 59, 53, 20],
    [5, 60, 63, 3, 48, 29, 39, 8],
    [26, 41, 22, 27, 18, 4, 52, 23],
    [11, 19, 36, 24, 46, 7, 15, 2]
  ];

  // 卦辭 (judgment text) for each [upperIdx][lowerIdx] combination
  var KW_GUACI = [
    ['元亨利貞。', '履虎尾，不咥人，亨。', '同人于野，亨。利涉大川，利君子貞。', '元亨利貞。其匪正有眚，不利有攸往。', '女壯，勿用取女。', '有孚，窒惕，中吉，終凶。利見大人，不利涉大川。', '亨，小利貞。', '否之匪人，不利君子貞，大往小來。'],
    ['揚于王庭，孚號，有厲。告自邑，不利即戎，利有攸往。', '亨，利貞。', '己日乃孚，元亨利貞，悔亡。', '元亨利貞，无咎。', '棟橈，利有攸往，亨。', '亨，貞，大人吉，无咎。有言不信。', '亨，利貞，取女吉。', '亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。'],
    ['元亨。', '小事吉。', '利貞，亨。畜牝牛，吉。', '亨。利用獄。', '元吉，亨。', '亨。小狐汔濟，濡其尾，无攸利。', '小亨，旅貞吉。', '康侯用錫馬蕃庶，晝日三接。'],
    ['利貞。', '征凶，无攸利。', '亨，王假之，勿憂，宜日中。', '亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。', '亨，无咎，利貞，利有攸往。', '利西南。无所往，其來復吉。有攸往，夙吉。', '亨，利貞，可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。', '利建侯行師。'],
    ['亨。密雲不雨，自我西郊。', '豚魚吉，利涉大川，利貞。', '利女貞。', '利有攸往，利涉大川。', '小亨，利有攸往，利見大人。', '亨。王假有廟，利涉大川，利貞。', '女歸吉，利貞。', '盥而不薦，有孚顒若。'],
    ['有孚，光亨，貞吉。利涉大川。', '亨。苦節不可貞。', '亨，小利貞。初吉終亂。', '元亨利貞，勿用有攸往，利建侯。', '改邑不改井，无喪无得，往來井井。汔至，亦未繘井，羸其瓶，凶。', '習坎，有孚，維心亨，行有尚。', '利西南，不利東北。利見大人，貞吉。', '吉。原筮元永貞，无咎。不寧方來，後夫凶。'],
    ['利貞，不家食吉，利涉大川。', '有孚，元吉，无咎，可貞，利有攸往。曷之用？二簋可用享。', '亨。小利有攸往。', '貞吉。觀頤，自求口實。', '元亨，利涉大川。先甲三日，後甲三日。', '亨。匪我求童蒙，童蒙求我。初噬告，再三瀆，瀆則不告。利貞。', '艮其背，不獲其身，行其庭，不見其人，无咎。', '不利有攸往。'],
    ['小往大來，吉亨。', '元亨利貞。至于八月有凶。', '利艱貞。', '亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往。', '元亨，用見大人，勿恤，南征吉。', '貞，丈人吉，无咎。', '亨，君子有終。', '元亨，利牝馬之貞。君子有攸往，先迷後得主，利西南得朋，東北喪朋。安貞吉。']
  ];

  // 爻辭 (line texts) keyed by King Wen sequence number (matches KW_NUM values)
  var YAO_CI = {
    1: { lines: ['初九：潛龍勿用。', '九二：見龍在田，利見大人。', '九三：君子終日乾乾，夕惕若厲，無咎。', '九四：或躍在淵，無咎。', '九五：飛龍在天，利見大人。', '上九：亢龍有悔。'], extra: '用九：見群龍無首，吉。' },
    2: { lines: ['初六：履霜，堅冰至。', '六二：直、方、大，不習無不利。', '六三：含章可貞。或從王事，無成有終。', '六四：括囊，無咎無譽。', '六五：黃裳，元吉。', '上六：龍戰於野，其血玄黃。'], extra: '用六：利永貞。' },
    3: { lines: ['初九：磐桓，利居貞，利建侯。', '六二：屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。', '六三：即鹿無虞，惟入于林中，君子幾不如舍，往吝。', '六四：乘馬班如，求婚媾，往吉，無不利。', '九五：屯其膏，小貞吉，大貞凶。', '上六：乘馬班如，泣血漣如。'] },
    4: { lines: ['初六：發蒙，利用刑人，用說桎梏，以往吝。', '九二：包蒙，吉。納婦吉，子克家。', '六三：勿用取女，見金夫，不有躬，無攸利。', '六四：困蒙，吝。', '六五：童蒙，吉。', '上九：擊蒙，不利為寇，利禦寇。'] },
    5: { lines: ['初九：需于郊，利用恆，無咎。', '九二：需于沙，小有言，終吉。', '九三：需于泥，致寇至。', '六四：需于血，出自穴。', '九五：需于酒食，貞吉。', '上六：入于穴，有不速之客三人來，敬之終吉。'] },
    6: { lines: ['初六：不永所事，小有言，終吉。', '九二：不克訟，歸而逋，其邑人三百戶，無眚。', '六三：食舊德，貞厲，終吉。或從王事，無成。', '九四：不克訟，復即命，渝，安貞吉。', '九五：訟，元吉。', '上九：或錫之鞶帶，終朝三褫之。'] },
    7: { lines: ['初六：師出以律，否臧凶。', '九二：在師中，吉，無咎，王三錫命。', '六三：師或輿尸，凶。', '六四：師左次，無咎。', '六五：田有禽，利執言，無咎。長子帥師，弟子輿尸，貞凶。', '上六：大君有命，開國承家，小人勿用。'] },
    8: { lines: ['初六：有孚比之，無咎。有孚盈缶，終來有它，吉。', '六二：比之自內，貞吉。', '六三：比之匪人。', '六四：外比之，貞吉。', '九五：顯比，王用三驅，失前禽，邑人不誡，吉。', '上六：比之無首，凶。'] },
    9: { lines: ['初九：復自道，何其咎，吉。', '九二：牽復，吉。', '九三：輿說輻，夫妻反目。', '六四：有孚，血去惕出，無咎。', '九五：有孚攣如，富以其鄰。', '上九：既雨既處，尚德載，婦貞厲。月幾望，君子征凶。'] },
    10: { lines: ['初九：素履，往無咎。', '九二：履道坦坦，幽人貞吉。', '六三：眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。', '九四：履虎尾，愬愬，終吉。', '九五：夬履，貞厲。', '上九：視履考祥，其旋元吉。'] },
    11: { lines: ['初九：拔茅茹，以其彙，征吉。', '九二：包荒，用馮河，不遐遺，朋亡，得尚于中行。', '九三：無平不陂，無往不復，艱貞無咎。勿恤其孚，于食有福。', '六四：翩翩不富，以其鄰，不戒以孚。', '六五：帝乙歸妹，以祉元吉。', '上六：城復于隍，勿用師，自邑告命，貞吝。'] },
    12: { lines: ['初六：拔茅茹，以其彙，貞吉，亨。', '六二：包承，小人吉，大人否，亨。', '六三：包羞。', '九四：有命，無咎，疇離祉。', '九五：休否，大人吉。其亡其亡，繫于苞桑。', '上九：傾否，先否後喜。'] },
    13: { lines: ['初九：同人于門，無咎。', '六二：同人于宗，吝。', '九三：伏戎于莽，升其高陵，三歲不興。', '九四：乘其墉，弗克攻，吉。', '九五：同人，先號咷而後笑，大師克相遇。', '上九：同人于郊，無悔。'] },
    14: { lines: ['初九：無交害，匪咎，艱則無咎。', '九二：大車以載，有攸往，無咎。', '九三：公用亨于天子，小人弗克。', '九四：匪其彭，無咎。', '六五：厥孚交如，威如，吉。', '上九：自天祐之，吉無不利。'] },
    15: { lines: ['初六：謙謙君子，用涉大川，吉。', '六二：鳴謙，貞吉。', '九三：勞謙君子，有終，吉。', '六四：無不利，撝謙。', '六五：不富以其鄰，利用侵伐，無不利。', '上六：鳴謙，利用行師，征邑國。'] },
    16: { lines: ['初六：鳴豫，凶。', '六二：介于石，不終日，貞吉。', '六三：盱豫，悔。遲有悔。', '九四：由豫，大有得。勿疑，朋盍簪。', '六五：貞疾，恆不死。', '上六：冥豫，成有渝，無咎。'] },
    17: { lines: ['初九：官有渝，貞吉。出門交有功。', '六二：係小子，失丈夫。', '六三：係丈夫，失小子。隨有求得，利居貞。', '九四：隨有獲，貞凶。有孚在道，以明，何咎。', '九五：孚于嘉，吉。', '上六：拘係之，乃從維之。王用亨于西山。'] },
    18: { lines: ['初六：幹父之蠱，有子，考無咎，厲終吉。', '九二：幹母之蠱，不可貞。', '九三：幹父之蠱，小有悔，無大咎。', '六四：裕父之蠱，往見吝。', '六五：幹父之蠱，用譽。', '上九：不事王侯，高尚其事。'] },
    19: { lines: ['初九：咸臨，貞吉。', '九二：咸臨，吉，無不利。', '六三：甘臨，無攸利。既憂之，無咎。', '六四：至臨，無咎。', '六五：知臨，大君之宜，吉。', '上六：敦臨，吉，無咎。'] },
    20: { lines: ['初六：童觀，小人無咎，君子吝。', '六二：闚觀，利女貞。', '六三：觀我生，進退。', '六四：觀國之光，利用賓于王。', '九五：觀我生，君子無咎。', '上九：觀其生，君子無咎。'] },
    21: { lines: ['初九：屨校滅趾，無咎。', '六二：噬膚滅鼻，無咎。', '六三：噬臘肉，遇毒，小吝，無咎。', '九四：噬乾胏，得金矢，利艱貞，吉。', '六五：噬乾肉，得黃金，貞厲，無咎。', '上九：何校滅耳，凶。'] },
    22: { lines: ['初九：賁其趾，舍車而徒。', '六二：賁其須。', '九三：賁如濡如，永貞吉。', '六四：賁如皤如，白馬翰如，匪寇婚媾。', '六五：賁于丘園，束帛戔戔，吝，終吉。', '上九：白賁，無咎。'] },
    23: { lines: ['初六：剝床以足，蔑貞凶。', '六二：剝床以辨，蔑貞凶。', '六三：剝之，無咎。', '六四：剝床以膚，凶。', '六五：貫魚，以宮人寵，無不利。', '上九：碩果不食，君子得輿，小人剝廬。'] },
    24: { lines: ['初九：不遠復，無祗悔，元吉。', '六二：休復，吉。', '六三：頻復，厲，無咎。', '六四：中行獨復。', '六五：敦復，無悔。', '上六：迷復，凶，有災眚。用行師，終有大敗，以其國君凶，至于十年不克征。'] },
    25: { lines: ['初九：无妄，往吉。', '六二：不耕獲，不菑畬，則利有攸往。', '六三：无妄之災，或繫之牛，行人之得，邑人之災。', '九四：可貞，無咎。', '九五：无妄之疾，勿藥有喜。', '上九：无妄，行有眚，無攸利。'] },
    26: { lines: ['初九：有厲，利已。', '九二：輿說輹。', '九三：良馬逐，利艱貞。曰閑輿衛，利有攸往。', '六四：童牛之牿，元吉。', '六五：豶豕之牙，吉。', '上九：何天之衢，亨。'] },
    27: { lines: ['初九：舍爾靈龜，觀我朵頤，凶。', '六二：顛頤，拂經，于丘頤，征凶。', '六三：拂頤，貞凶，十年勿用，無攸利。', '六四：顛頤，吉。虎視眈眈，其欲逐逐，無咎。', '六五：拂經，居貞吉，不可涉大川。', '上九：由頤，厲吉，利涉大川。'] },
    28: { lines: ['初六：藉用白茅，無咎。', '九二：枯楊生稊，老夫得其女妻，無不利。', '九三：棟橈，凶。', '九四：棟隆，吉。有它，吝。', '九五：枯楊生華，老婦得其士夫，無咎無譽。', '上六：過涉滅頂，凶，無咎。'] },
    29: { lines: ['初六：習坎，入于坎窞，凶。', '九二：坎有險，求小得。', '六三：來之坎坎，險且枕，入于坎窞，勿用。', '六四：樽酒簋貳，用缶，納約自牖，終無咎。', '九五：坎不盈，祗既平，無咎。', '上六：係用徽纆，寘于叢棘，三歲不得，凶。'] },
    30: { lines: ['初九：履錯然，敬之，無咎。', '六二：黃離，元吉。', '九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。', '九四：突如其來如，焚如，死如，棄如。', '六五：出涕沱若，戚嗟若，吉。', '上九：王用出征，有嘉折首，獲匪其醜，無咎。'] },
    31: { lines: ['初六：咸其拇。', '六二：咸其腓，凶，居吉。', '九三：咸其股，執其隨，往吝。', '九四：貞吉，悔亡。憧憧往來，朋從爾思。', '九五：咸其脢，無悔。', '上六：咸其輔頰舌。'] },
    32: { lines: ['初六：浚恆，貞凶，無攸利。', '九二：悔亡。', '九三：不恆其德，或承之羞，貞吝。', '九四：田無禽。', '六五：恆其德，貞，婦人吉，夫子凶。', '上六：振恆，凶。'] },
    33: { lines: ['初六：遯尾，厲，勿用有攸往。', '六二：執之用黃牛之革，莫之勝說。', '九三：係遯，有疾厲，畜臣妾，吉。', '九四：好遯，君子吉，小人否。', '九五：嘉遯，貞吉。', '上九：肥遯，無不利。'] },
    34: { lines: ['初九：壯于趾，征凶，有孚。', '九二：貞吉。', '九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。', '九四：貞吉，悔亡。藩決不羸，壯于大輿之輹。', '六五：喪羊于易，無悔。', '上六：羝羊觸藩，不能退，不能遂，無攸利，艱則吉。'] },
    35: { lines: ['初六：晉如摧如，貞吉。罔孚，裕，無咎。', '六二：晉如愁如，貞吉。受茲介福，于其王母。', '六三：眾允，悔亡。', '九四：晉如鼫鼠，貞厲。', '六五：悔亡，失得勿恤，往吉，無不利。', '上九：晉其角，維用伐邑，厲吉，無咎，貞吝。'] },
    36: { lines: ['初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。', '六二：明夷，夷于左股，用拯馬壯，吉。', '九三：明夷于南狩，得其大首，不可疾貞。', '六四：入于左腹，獲明夷之心，于出門庭。', '六五：箕子之明夷，利貞。', '上六：不明晦，初登于天，後入于地。'] },
    37: { lines: ['初九：閑有家，悔亡。', '六二：無攸遂，在中饋，貞吉。', '九三：家人嗃嗃，悔厲，吉。婦子嘻嘻，終吝。', '六四：富家，大吉。', '九五：王假有家，勿恤，吉。', '上九：有孚威如，終吉。'] },
    38: { lines: ['初九：悔亡。喪馬勿逐，自復。見惡人，無咎。', '九二：遇主于巷，無咎。', '六三：見輿曳，其牛掣，其人天且劓，無初有終。', '九四：睽孤，遇元夫，交孚，厲，無咎。', '六五：悔亡，厥宗噬膚，往何咎。', '上九：睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。'] },
    39: { lines: ['初六：往蹇，來譽。', '六二：王臣蹇蹇，匪躬之故。', '九三：往蹇，來反。', '六四：往蹇，來連。', '九五：大蹇，朋來。', '上六：往蹇，來碩，吉，利見大人。'] },
    40: { lines: ['初六：無咎。', '九二：田獲三狐，得黃矢，貞吉。', '六三：負且乘，致寇至，貞吝。', '九四：解而拇，朋至斯孚。', '六五：君子維有解，吉，有孚于小人。', '上六：公用射隼于高墉之上，獲之，無不利。'] },
    41: { lines: ['初九：已事遄往，無咎，酌損之。', '九二：利貞，征凶，弗損益之。', '六三：三人行，則損一人；一人行，則得其友。', '六四：損其疾，使遄有喜，無咎。', '六五：或益之十朋之龜，弗克違，元吉。', '上九：弗損益之，無咎，貞吉，利有攸往，得臣無家。'] },
    42: { lines: ['初九：利用為大作，元吉，無咎。', '六二：或益之十朋之龜，弗克違，永貞吉。王用享于帝，吉。', '六三：益之用凶事，無咎。有孚中行，告公用圭。', '六四：中行，告公從。利用為依遷國。', '九五：有孚惠心，勿問元吉。有孚惠我德。', '上九：莫益之，或擊之，立心勿恆，凶。'] },
    43: { lines: ['初九：壯于前趾，往不勝為咎。', '九二：惕號，莫夜有戎，勿恤。', '九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，無咎。', '九四：臀無膚，其行次且。牽羊悔亡，聞言不信。', '九五：莧陸夬夬，中行無咎。', '上六：無號，終有凶。'] },
    44: { lines: ['初六：繫于金柅，貞吉，有攸往，見凶，羸豕孚蹢躅。', '九二：包有魚，無咎，不利賓。', '九三：臀無膚，其行次且，厲，無大咎。', '九四：包無魚，起凶。', '九五：以杞包瓜，含章，有隕自天。', '上九：姤其角，吝，無咎。'] },
    45: { lines: ['初六：有孚不終，乃亂乃萃。若號，一握為笑，勿恤，往無咎。', '六二：引吉，無咎，孚乃利用禴。', '六三：萃如嗟如，無攸利，往無咎，小吝。', '九四：大吉，無咎。', '九五：萃有位，無咎。匪孚，元永貞，悔亡。', '上六：齎咨涕洟，無咎。'] },
    46: { lines: ['初六：允升，大吉。', '九二：孚乃利用禴，無咎。', '九三：升虛邑。', '六四：王用亨于岐山，吉，無咎。', '六五：貞吉，升階。', '上六：冥升，利于不息之貞。'] },
    47: { lines: ['初六：臀困于株木，入于幽谷，三歲不覿。', '九二：困于酒食，朱紱方來，利用享祀，征凶，無咎。', '六三：困于石，據于蒺藜，入于其宮，不見其妻，凶。', '九四：來徐徐，困于金車，吝，有終。', '九五：劓刖，困于赤紱，乃徐有說，利用祭祀。', '上六：困于葛藟，于臲卼，曰動悔，有悔，征吉。'] },
    48: { lines: ['初六：井泥不食，舊井無禽。', '九二：井谷射鮒，甕敝漏。', '九三：井渫不食，為我心惻，可用汲，王明，並受其福。', '六四：井甃，無咎。', '九五：井洌，寒泉食。', '上六：井收勿幕，有孚元吉。'] },
    49: { lines: ['初九：鞏用黃牛之革。', '六二：己日乃革之，征吉，無咎。', '九三：征凶，貞厲。革言三就，有孚。', '九四：悔亡，有孚改命，吉。', '九五：大人虎變，未占有孚。', '上六：君子豹變，小人革面，征凶，居貞吉。'] },
    50: { lines: ['初六：鼎顛趾，利出否，得妾以其子，無咎。', '九二：鼎有實，我仇有疾，不我能即，吉。', '九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。', '九四：鼎折足，覆公餗，其形渥，凶。', '六五：鼎黃耳金鉉，利貞。', '上九：鼎玉鉉，大吉，無不利。'] },
    51: { lines: ['初九：震來虩虩，後笑言啞啞，吉。', '六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。', '六三：震蘇蘇，震行無眚。', '九四：震遂泥。', '六五：震往來厲，億無喪，有事。', '上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，無咎，婚媾有言。'] },
    52: { lines: ['初六：艮其趾，無咎，利永貞。', '六二：艮其腓，不拯其隨，其心不快。', '九三：艮其限，列其夤，厲薰心。', '六四：艮其身，無咎。', '六五：艮其輔，言有序，悔亡。', '上九：敦艮，吉。'] },
    53: { lines: ['初六：鴻漸于干，小子厲，有言，無咎。', '六二：鴻漸于磐，飲食衎衎，吉。', '九三：鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。', '六四：鴻漸于木，或得其桷，無咎。', '九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。', '上九：鴻漸于逵，其羽可用為儀，吉。'] },
    54: { lines: ['初九：歸妹以娣，跛能履，征吉。', '九二：眇能視，利幽人之貞。', '六三：歸妹以須，反歸以娣。', '九四：歸妹愆期，遲歸有時。', '六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。', '上六：女承筐無實，士刲羊無血，無攸利。'] },
    55: { lines: ['初九：遇其配主，雖旬無咎，往有尚。', '六二：豐其蔀，日中見斗，往得疑疾，有孚發若，吉。', '九三：豐其沛，日中見沬，折其右肱，無咎。', '九四：豐其蔀，日中見斗，遇其夷主，吉。', '六五：來章，有慶譽，吉。', '上六：豐其屋，蔀其家，闚其戶，闃其無人，三歲不覿，凶。'] },
    56: { lines: ['初六：旅瑣瑣，斯其所取災。', '六二：旅即次，懷其資，得童僕貞。', '九三：旅焚其次，喪其童僕，貞厲。', '九四：旅于處，得其資斧，我心不快。', '六五：射雉一矢亡，終以譽命。', '上九：鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。'] },
    57: { lines: ['初六：進退，利武人之貞。', '九二：巽在床下，用史巫紛若，吉，無咎。', '九三：頻巽，吝。', '六四：悔亡，田獲三品。', '九五：貞吉，悔亡，無不利。無初有終，先庚三日，後庚三日，吉。', '上九：巽在床下，喪其資斧，貞凶。'] },
    58: { lines: ['初九：和兌，吉。', '九二：孚兌，吉，悔亡。', '六三：來兌，凶。', '九四：商兌未寧，介疾有喜。', '九五：孚于剝，有厲。', '上六：引兌。'] },
    59: { lines: ['初六：用拯馬壯，吉。', '九二：渙奔其機，悔亡。', '六三：渙其躬，無悔。', '六四：渙其群，元吉。渙有丘，匪夷所思。', '九五：渙汗其大號，渙王居，無咎。', '上九：渙其血，去逖出，無咎。'] },
    60: { lines: ['初九：不出戶庭，無咎。', '九二：不出門庭，凶。', '六三：不節若，則嗟若，無咎。', '六四：安節，亨。', '九五：甘節，吉，往有尚。', '上六：苦節，貞凶，悔亡。'] },
    61: { lines: ['初九：虞吉，有它不燕。', '九二：鳴鶴在陰，其子和之。我有好爵，吾與爾靡之。', '六三：得敵，或鼓或罷，或泣或歌。', '六四：月幾望，馬匹亡，無咎。', '九五：有孚攣如，無咎。', '上九：翰音登于天，貞凶。'] },
    62: { lines: ['初六：飛鳥以凶。', '六二：過其祖，遇其妣，不及其君，遇其臣，無咎。', '九三：弗過防之，從或戕之，凶。', '九四：無咎，弗過遇之。往厲必戒，勿用永貞。', '六五：密雲不雨，自我西郊，公弋取彼在穴。', '上六：弗遇過之，飛鳥離之，凶，是謂災眚。'] },
    63: { lines: ['初九：曳其輪，濡其尾，無咎。', '六二：婦喪其茀，勿逐，七日得。', '九三：高宗伐鬼方，三年克之，小人勿用。', '六四：繻有衣袽，終日戒。', '九五：東鄰殺牛，不如西鄰之禴祭，實受其福。', '上六：濡其首，厲。'] },
    64: { lines: ['初六：濡其尾，吝。', '九二：曳其輪，貞吉。', '六三：未濟，征凶，利涉大川。', '九四：貞吉，悔亡。震用伐鬼方，三年有賞于大國。', '六五：貞吉，無悔，君子之光，有孚，吉。', '上九：有孚于飲酒，無咎，濡其首，有孚失是。'] }
  };

  var ALL_NAMES = [];
  (function buildAllNames() {
    var r, c;
    for (r = 0; r < 8; r++) {
      for (c = 0; c < 8; c++) {
        ALL_NAMES.push(HEX_TABLE[r][c]);
      }
    }
  })();

  var STORAGE_KEY = 'yijing_hex_quiz_stats_v2';
  var DEFAULT_STATS = {
    normal: { score: 0, total: 0, streak: 0, best: 0 },
    advanced: { score: 0, total: 0, streak: 0, best: 0 }
  };

  function loadAllStats() {
    var raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      raw = null;
    }
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.normal && parsed.advanced) { return parsed; }
      } catch (e2) { /* fall through to default */ }
    }
    return { normal: { score: 0, total: 0, streak: 0, best: 0 }, advanced: { score: 0, total: 0, streak: 0, best: 0 } };
  }

  function saveAllStats() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allStats));
    } catch (e) {
      /* ignore storage errors (private mode / iOS webview) */
    }
  }

  var mode = 'normal'; // 'normal' | 'advanced'
  var allStats = loadAllStats();
  var stats = allStats[mode];
  var current = null;
  var answered = false;

  var scoreEl = document.getElementById('scoreEl');
  var totalEl = document.getElementById('totalEl');
  var streakEl = document.getElementById('streakEl');
  var bestEl = document.getElementById('bestEl');
  var hexDisplay = document.getElementById('hexDisplay');
  var trigramInfo = document.getElementById('trigramInfo');
  var optionsContainer = document.getElementById('optionsContainer');
  var feedbackEl = document.getElementById('feedback');
  var nextBtn = document.getElementById('nextBtn');
  var resetStatsBtn = document.getElementById('resetStatsBtn');
  var modeNormalBtn = document.getElementById('modeNormalBtn');
  var modeAdvancedBtn = document.getElementById('modeAdvancedBtn');
  var modeHint = document.getElementById('modeHint');

  function renderStats() {
    scoreEl.textContent = String(stats.score);
    totalEl.textContent = String(stats.total);
    streakEl.textContent = String(stats.streak);
    bestEl.textContent = String(stats.best);
  }

  function getRandomInt(max) {
    return Math.floor(Math.random() * max);
  }

  function shuffle(arr) {
    var i, j, tmp;
    for (i = arr.length - 1; i > 0; i--) {
      j = getRandomInt(i + 1);
      tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function buildHexLines(upperName, lowerName) {
    var upperLines = TRIGRAM[upperName].lines; // bottom-to-top of trigram
    var lowerLines = TRIGRAM[lowerName].lines;
    var topDown = [];
    var k;
    // top of hexagram = top of upper trigram down to bottom of upper trigram
    for (k = 2; k >= 0; k--) { topDown.push(upperLines[k]); }
    for (k = 2; k >= 0; k--) { topDown.push(lowerLines[k]); }
    return topDown;
  }

  function renderHexagram(container, upperName, lowerName) {
    var lines = buildHexLines(upperName, lowerName);
    container.innerHTML = '';
    var i;
    for (i = 0; i < lines.length; i++) {
      var lineEl = document.createElement('div');
      lineEl.className = 'yao-line ' + (lines[i] === 1 ? 'yang' : 'yin');
      if (lines[i] === 1) {
        var bar = document.createElement('div');
        bar.className = 'bar';
        lineEl.appendChild(bar);
      } else {
        var bar1 = document.createElement('div');
        bar1.className = 'bar';
        var bar2 = document.createElement('div');
        bar2.className = 'bar';
        lineEl.appendChild(bar1);
        lineEl.appendChild(bar2);
      }
      container.appendChild(lineEl);
      if (i === 2) {
        var divider = document.createElement('div');
        divider.className = 'trigram-divider';
        container.appendChild(divider);
      }
    }
  }

  function renderTrigramInfo(upperName, lowerName) {
    var u = TRIGRAM[upperName];
    var l = TRIGRAM[lowerName];
    trigramInfo.innerHTML =
      '上卦：<b>' + u.symbol + ' ' + upperName + '（' + u.nature + '）</b>　' +
      '下卦：<b>' + l.symbol + ' ' + lowerName + '（' + l.nature + '）</b>';
  }

  function isPureIdx(u, l) { return u === l; }

  // Non-pure hexagram names always start with the two single-character
  // trigram natures (e.g. "雷水解" = 雷+水+解), so the first 2 characters
  // are always the "prefix" and the rest is the distinguishing "suffix".
  function getPrefix(u, l) {
    return TRIGRAM[ORDER[u]].nature + TRIGRAM[ORDER[l]].nature;
  }
  function getSuffix(u, l) {
    if (isPureIdx(u, l)) { return null; }
    return HEX_TABLE[u][l].substring(2);
  }

  // Advanced mode: build fake-but-plausible names that share the exact
  // same prefix as the correct answer, using real suffix characters
  // borrowed from hexagrams that share the same upper or lower trigram.
  function buildAdvancedOptions(upperIdx, lowerIdx, correctName) {
    if (isPureIdx(upperIdx, lowerIdx)) {
      // No clean prefix/suffix split for pure trigrams (乾為天 style) -
      // fall back to real names sharing the same row/column, which still
      // all contain the same nature character as the question.
      var poolNames = [];
      var k2;
      for (k2 = 0; k2 < 8; k2++) {
        if (k2 !== lowerIdx) { poolNames.push(HEX_TABLE[upperIdx][k2]); }
        if (k2 !== upperIdx) { poolNames.push(HEX_TABLE[k2][lowerIdx]); }
      }
      poolNames = uniqueArr(poolNames, correctName);
      shuffle(poolNames);
      var chosen = poolNames.slice(0, 3);
      var opts = [correctName].concat(chosen);
      return padOptionsIfNeeded(opts, correctName);
    }

    var prefix = getPrefix(upperIdx, lowerIdx);
    var correctSuffix = getSuffix(upperIdx, lowerIdx);
    var suffixPool = [];
    var k;
    for (k = 0; k < 8; k++) {
      if (k !== lowerIdx && !isPureIdx(upperIdx, k)) {
        suffixPool.push(HEX_TABLE[upperIdx][k].substring(2));
      }
      if (k !== upperIdx && !isPureIdx(k, lowerIdx)) {
        suffixPool.push(HEX_TABLE[k][lowerIdx].substring(2));
      }
    }
    suffixPool = uniqueArr(suffixPool, correctSuffix);
    shuffle(suffixPool);

    var fakeNames = [];
    var i;
    for (i = 0; i < suffixPool.length && fakeNames.length < 3; i++) {
      var fake = prefix + suffixPool[i];
      if (fake !== correctName && fakeNames.indexOf(fake) === -1) {
        fakeNames.push(fake);
      }
    }
    var options = [correctName].concat(fakeNames);
    return padOptionsIfNeeded(options, correctName);
  }

  function uniqueArr(arr, excludeVal) {
    var seen = {};
    var out = [];
    var i;
    for (i = 0; i < arr.length; i++) {
      var v = arr[i];
      if (v !== excludeVal && !seen[v]) {
        seen[v] = true;
        out.push(v);
      }
    }
    return out;
  }

  function padOptionsIfNeeded(options, correctName) {
    var guard = 0;
    while (options.length < 4 && guard < 500) {
      guard++;
      var candidate = ALL_NAMES[getRandomInt(ALL_NAMES.length)];
      if (options.indexOf(candidate) === -1) {
        options.push(candidate);
      }
    }
    return options;
  }

  function buildNormalOptions(correctName) {
    var options = [correctName];
    return padOptionsIfNeeded(options, correctName);
  }

  function renderOptions(upperIdx, lowerIdx, correctName) {
    var options = mode === 'advanced'
      ? buildAdvancedOptions(upperIdx, lowerIdx, correctName)
      : buildNormalOptions(correctName);

    shuffle(options);

    optionsContainer.innerHTML = '';
    var i;
    for (i = 0; i < options.length; i++) {
      (function (name) {
        var btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = name;
        btn.addEventListener('click', function () {
          checkAnswer(name, btn);
        });
        optionsContainer.appendChild(btn);
      })(options[i]);
    }
  }

  function checkAnswer(selectedName, btnEl) {
    if (answered) { return; }
    answered = true;

    var isCorrect = selectedName === current.name;
    var buttons = optionsContainer.querySelectorAll('.opt-btn');
    var i;
    for (i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      if (b.textContent === current.name) {
        b.className = 'opt-btn correct';
      } else if (b === btnEl && !isCorrect) {
        b.className = 'opt-btn wrong';
      } else {
        b.className = 'opt-btn disabled-dim';
      }
    }

    stats.total++;
    if (isCorrect) {
      stats.score++;
      stats.streak++;
      if (stats.streak > stats.best) { stats.best = stats.streak; }
      feedbackEl.textContent = '答對了！' + current.name;
    } else {
      stats.streak = 0;
      feedbackEl.textContent = '答錯了，正確答案是「' + current.name + '」';
    }
    saveAllStats();
    renderStats();
    nextBtn.classList.remove('hidden');
  }

  function newQuestion() {
    var upperIdx = getRandomInt(8);
    var lowerIdx = getRandomInt(8);
    var upperName = ORDER[upperIdx];
    var lowerName = ORDER[lowerIdx];
    var name = HEX_TABLE[upperIdx][lowerIdx];

    current = { upperName: upperName, lowerName: lowerName, upperIdx: upperIdx, lowerIdx: lowerIdx, name: name };
    answered = false;

    renderHexagram(hexDisplay, upperName, lowerName);
    renderTrigramInfo(upperName, lowerName);
    renderOptions(upperIdx, lowerIdx, name);

    feedbackEl.textContent = '';
    nextBtn.classList.add('hidden');
  }

  nextBtn.addEventListener('click', newQuestion);

  resetStatsBtn.addEventListener('click', function () {
    allStats[mode] = { score: 0, total: 0, streak: 0, best: 0 };
    stats = allStats[mode];
    saveAllStats();
    renderStats();
  });

  function setMode(newMode) {
    if (mode === newMode) { return; }
    mode = newMode;
    stats = allStats[mode];
    if (mode === 'advanced') {
      modeAdvancedBtn.className = 'mode-btn active';
      modeNormalBtn.className = 'mode-btn';
      modeHint.textContent = '進階：四個選項同一上下卦前綴，只有一個尾字正確';
    } else {
      modeNormalBtn.className = 'mode-btn active';
      modeAdvancedBtn.className = 'mode-btn';
      modeHint.textContent = '初級：四個選項來自任意卦名';
    }
    renderStats();
    newQuestion();
  }

  modeNormalBtn.addEventListener('click', function () { setMode('normal'); });
  modeAdvancedBtn.addEventListener('click', function () { setMode('advanced'); });

  // ---- Reference table view ----
  function buildTableView() {
    var table = document.getElementById('hexGridTable');
    table.innerHTML = '';

    var headRow = document.createElement('tr');
    var cornerTh = document.createElement('th');
    cornerTh.textContent = '上\\下';
    headRow.appendChild(cornerTh);
    var c, r;
    for (c = 0; c < 8; c++) {
      var th = document.createElement('th');
      th.innerHTML = TRIGRAM[ORDER[c]].symbol + '<br>' + ORDER[c];
      headRow.appendChild(th);
    }
    table.appendChild(headRow);

    for (r = 0; r < 8; r++) {
      var row = document.createElement('tr');
      var rowTh = document.createElement('th');
      rowTh.innerHTML = TRIGRAM[ORDER[r]].symbol + '<br>' + ORDER[r];
      row.appendChild(rowTh);
      for (c = 0; c < 8; c++) {
        (function (upperIdx, lowerIdx) {
          var td = document.createElement('td');
          td.textContent = HEX_TABLE[upperIdx][lowerIdx];
          td.addEventListener('click', function () {
            openHexDetail(upperIdx, lowerIdx);
          });
          row.appendChild(td);
        })(r, c);
      }
      table.appendChild(row);
    }
  }

  // ---- Hexagram detail modal ----
  var modalOverlay = document.getElementById('modalOverlay');
  var modalCard = document.getElementById('modalCard');
  var modalNum = document.getElementById('modalNum');
  var modalTitle = document.getElementById('modalTitle');
  var modalHexDisplay = document.getElementById('modalHexDisplay');
  var modalTrigrams = document.getElementById('modalTrigrams');
  var modalGuaci = document.getElementById('modalGuaci');
  var modalYaoList = document.getElementById('modalYaoList');
  var modalCloseBtn = document.getElementById('modalCloseBtn');
  var fontDecBtn = document.getElementById('fontDecBtn');
  var fontIncBtn = document.getElementById('fontIncBtn');

  var FONT_SCALE_KEY = 'yijing_hex_modal_font_scale_v1';
  var FONT_SCALE_MIN = 0.85;
  var FONT_SCALE_MAX = 1.7;
  var FONT_SCALE_STEP = 0.15;

  function loadFontScale() {
    var raw = null;
    try {
      raw = localStorage.getItem(FONT_SCALE_KEY);
    } catch (e) {
      raw = null;
    }
    var val = raw ? parseFloat(raw) : 1;
    if (!val || isNaN(val)) { val = 1; }
    if (val < FONT_SCALE_MIN) { val = FONT_SCALE_MIN; }
    if (val > FONT_SCALE_MAX) { val = FONT_SCALE_MAX; }
    return val;
  }

  function saveFontScale(val) {
    try {
      localStorage.setItem(FONT_SCALE_KEY, String(val));
    } catch (e) {
      /* ignore storage errors */
    }
  }

  var fontScale = loadFontScale();

  function applyFontScale() {
    modalCard.style.setProperty('--modal-font-scale', String(fontScale));
    fontDecBtn.disabled = fontScale <= FONT_SCALE_MIN + 0.001;
    fontIncBtn.disabled = fontScale >= FONT_SCALE_MAX - 0.001;
  }

  function changeFontScale(delta) {
    var next = Math.round((fontScale + delta) * 100) / 100;
    if (next < FONT_SCALE_MIN) { next = FONT_SCALE_MIN; }
    if (next > FONT_SCALE_MAX) { next = FONT_SCALE_MAX; }
    fontScale = next;
    saveFontScale(fontScale);
    applyFontScale();
  }

  fontDecBtn.addEventListener('click', function () { changeFontScale(-FONT_SCALE_STEP); });
  fontIncBtn.addEventListener('click', function () { changeFontScale(FONT_SCALE_STEP); });

  function openHexDetail(upperIdx, lowerIdx) {
    var upperName = ORDER[upperIdx];
    var lowerName = ORDER[lowerIdx];
    var u = TRIGRAM[upperName];
    var l = TRIGRAM[lowerName];
    var name = HEX_TABLE[upperIdx][lowerIdx];
    var num = KW_NUM[upperIdx][lowerIdx];

    applyFontScale();
    modalNum.textContent = '第 ' + num + ' 卦';
    modalTitle.textContent = name;
    renderHexagram(modalHexDisplay, upperName, lowerName);
    modalTrigrams.innerHTML =
      '上卦：<b>' + u.symbol + ' ' + upperName + '（' + u.nature + '）</b>　' +
      '下卦：<b>' + l.symbol + ' ' + lowerName + '（' + l.nature + '）</b>';
    modalGuaci.textContent = KW_GUACI[upperIdx][lowerIdx];

    modalYaoList.innerHTML = '';
    var yaoData = YAO_CI[num];
    if (yaoData) {
      var i;
      for (i = 0; i < yaoData.lines.length; i++) {
        var li = document.createElement('li');
        li.textContent = yaoData.lines[i];
        modalYaoList.appendChild(li);
      }
      if (yaoData.extra) {
        var extraLi = document.createElement('li');
        extraLi.className = 'modal-yao-extra';
        extraLi.textContent = yaoData.extra;
        modalYaoList.appendChild(extraLi);
      }
    }

    modalOverlay.classList.remove('hidden');
  }

  function closeHexDetail() {
    modalOverlay.classList.add('hidden');
  }

  modalCloseBtn.addEventListener('click', closeHexDetail);
  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) { closeHexDetail(); }
  });

  // ---- Tabs ----
  var tabQuiz = document.getElementById('tabQuiz');
  var tabTable = document.getElementById('tabTable');
  var quizView = document.getElementById('quizView');
  var tableView = document.getElementById('tableView');
  var tableBuilt = false;

  tabQuiz.addEventListener('click', function () {
    tabQuiz.className = 'tab-btn active';
    tabTable.className = 'tab-btn';
    quizView.classList.remove('hidden');
    tableView.classList.add('hidden');
  });

  tabTable.addEventListener('click', function () {
    tabTable.className = 'tab-btn active';
    tabQuiz.className = 'tab-btn';
    tableView.classList.remove('hidden');
    quizView.classList.add('hidden');
    if (!tableBuilt) {
      buildTableView();
      tableBuilt = true;
    }
  });

  // ---- init ----
  renderStats();
  newQuestion();

      var swCode = [

        "self.addEventListener('install', function (e) {",
        "  e.waitUntil(caches.open(CACHE_NAME).then(function (cache) {",

        "  }));",
        "  self.skipWaiting();",
        "});",
        "self.addEventListener('activate', function (e) { self.clients.claim(); });",
        "self.addEventListener('fetch', function (e) {",
        "  if (e.request.method !== 'GET') { return; }",
        "  e.respondWith(",
        "    caches.match(e.request).then(function (cached) {",
        "      return cached || fetch(e.request).then(function (res) {",
        "        var resClone = res.clone();",
        "        caches.open(CACHE_NAME).then(function (cache) { cache.put(e.request, resClone); });",
        "        return res;",
        "      }).catch(function () { return cached; });",
        "    })",
        "  );",
        "});"
      ].join('\n');
      var swBlob = new Blob([swCode], { type: 'application/javascript' });
      var swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(function () {
        /* ignore registration failures (e.g. unsupported webview) */
      });
    } catch (e) {
      /* ignore */
    }
  }

  try {
    var manifest = {
      name: '易經六十四卦',
      short_name: '易經卦名',
      start_url: '.',
      display: 'standalone',
      background_color: '#2b2420',
      theme_color: '#2b2420',
      icons: [{
        src: 'data:image/svg+xml;utf8,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192">' +
          '<rect width="192" height="192" fill="%232b2420"/>' +
          '<text x="96" y="120" font-size="90" text-anchor="middle" fill="%23d9b45c">卦</text>' +
          '</svg>'
        ),
        sizes: '192x192',
        type: 'image/svg+xml'
      }]
    };
    var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    var manifestUrl = URL.createObjectURL(manifestBlob);
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);
  } catch (e2) {
    /* ignore */
  }

})();
